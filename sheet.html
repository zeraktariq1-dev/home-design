:root{--surface:#fff;--surface-2:#f6f7f6;--line:#dadddb;--ink:#111312;--muted:#6b726e;color-scheme:light}
html,body{margin:0;height:100%;background:#fff;color:#111;font-family:K24,'Segoe UI',Tahoma,sans-serif;-webkit-text-size-adjust:100%}
.inp{font:inherit;border:1px solid #c8c6c4;border-radius:4px;padding:2px 6px;background:#fff;color:#111}
.btn{font:inherit;cursor:pointer;border:1px solid #c8c6c4;border-radius:6px;padding:6px 12px;background:#fff}
.wait{display:grid;place-items:center;height:100vh;color:#888;font-size:20px}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#217346;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:50}
[hidden]{display:none!important}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.xi{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.xi:hover{border-color:#1D6F42}
.xi svg{width:22px;height:22px;stroke:#1D6F42;fill:none;stroke-width:1.7}
.xi small{display:block;color:var(--muted);font-size:12px}
.ssstatus{display:flex;gap:18px;justify-content:flex-end;flex-wrap:wrap;font-size:12.5px;color:#333;background:#f3f3f3;border:1px solid #bdbdbd;border-top:0;padding:4px 12px;min-height:26px;direction:ltr}
.ssstatus b{font-weight:700;color:#000}
.sstool{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ssb{all:unset;cursor:pointer;min-width:30px;height:30px;padding:0 8px;box-sizing:border-box;border-radius:6px;display:inline-grid;place-items:center;font-size:13px;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
.ssb:hover{background:var(--surface-2)}.ssb.on{background:#217346;color:#fff;border-color:#217346}
.ssgrp{display:inline-flex;gap:3px;align-items:center}
.ssw{all:unset;cursor:pointer;width:20px;height:20px;border-radius:4px;border:1px solid #9a9a9a;display:inline-grid;place-items:center;font-size:12px;font-weight:800;box-sizing:border-box}
.sssel{padding:4px 8px;font-size:13px;max-width:180px}
.ssname{font-size:19px;font-weight:800;min-width:220px;max-width:100%}
.ssfx{display:flex;align-items:stretch;border:1px solid #bdbdbd;border-radius:8px 8px 0 0;overflow:hidden;background:#fff;color:#000;direction:ltr;border-bottom:0;border-radius:8px 8px 0 0}
.ssaddr{min-width:96px;padding:6px 10px;border-right:1px solid #d0d0d0;font-family:Consolas,'Segoe UI',monospace;font-size:13px;background:#f3f3f3;color:#000}
.ssfxl{padding:6px 10px;color:#777;font-style:italic;border-right:1px solid #d0d0d0}
.ssfx input{all:unset;flex:1;padding:6px 10px;font-family:Consolas,'K24','Segoe UI',monospace;font-size:13.5px;color:#000}
.sswrap{overflow:auto;height:calc(100vh - 340px);min-height:320px;background:#fff;color:#000;border:1px solid #bdbdbd;outline:none}
.sswrap:focus{box-shadow:0 0 0 2px rgba(33,115,70,.35)}
table.ss{border-collapse:collapse;table-layout:fixed;font-family:Calibri,'K24',Arial,sans-serif;font-size:14.5px;color:#000;width:max-content}
.ss th{position:sticky;top:0;z-index:2;background:#f3f3f3;color:#444;font-weight:400;font-size:12px;border:1px solid #d4d4d4;height:22px;user-select:none;text-align:center;padding:0}
.ss tbody th{position:sticky;inset-inline-start:0;top:auto;z-index:1}
.ss thead th:first-child{inset-inline-start:0;z-index:3}
.ss th.hi{background:#d3e6da;color:#217346;font-weight:700}
.ss td{border:1px solid #e3e3e3;padding:0 5px;white-space:nowrap;overflow:hidden;vertical-align:bottom;background:#fff;cursor:cell;user-select:none;line-height:1.25}
.ss td[rowspan]{vertical-align:middle}
.ss td.in{box-shadow:inset 0 0 0 9999px rgba(33,115,70,.13)}
.ss td.act{outline:2px solid #217346;outline-offset:-2px;box-shadow:none}
.ss td.err{color:#c00000}
.ss td #ss_edit{all:unset;width:100%;box-sizing:border-box;font:inherit;color:#000;background:#fff;cursor:text}
.sstabs{display:flex;gap:2px;flex-wrap:wrap;align-items:center;background:#f3f3f3;border:1px solid #bdbdbd;border-top:0;border-radius:0 0 8px 8px;padding:4px;color:#000}
.sstabs button{all:unset;cursor:pointer;padding:5px 14px;font-size:13px;border-radius:5px;color:#333}
.sstabs button.on{background:#fff;color:#217346;font-weight:800;box-shadow:inset 0 -3px 0 #217346}
.sstabs button.del{margin-inline-start:auto;color:#a00}.sstabs button.del.sure{background:#c00000;color:#fff}
.sstabs input{padding:3px 8px;font-size:13px;width:140px}
.ssxl-q{all:unset;cursor:pointer;width:28px;height:26px;display:grid;place-items:center;border-radius:3px;color:#fff}.ssxl-q:hover{background:rgba(255,255,255,.18)}
body.ssfull .ssxl{justify-content:flex-start}
@media (max-width:1500px){.xg .xin[disabled]{display:none}.xb.big{min-width:40px;padding:4px 4px}.xg{padding:0 4px}}
body.ssfull .ssxl-n{font:400 13px 'Segoe UI',Calibri,Arial,sans-serif}

async function ssAuto(fn){const sh=ssSheet();if(!sh)return;const {r1,r2,c1,c2}=ssSel();const cache={},st=new Set();

    if(r<r1-1)out.push([r1,c1,f(col(c1,r+1,r1-1)),ssAddr(r1-1,c1)]);
    else{let c=c1-1;while(c>=0&&isNum(r1,c))c--;if(c<c1-1)out.push([r1,c1,f(row(r1,c+1,c1-1)),ssAddr(r1,c1-1)])}
    if(!out.length){toast("هیچ ژمارەیەک لە سەرەوە یان لای تەنیشتی ئەم خانەیە نییە");return}}
  else if(r2>r1){for(let c=c1;c<=c2;c++)out.push([r2+1,c,f(col(c,r1,r2)),ssAddr(r2,c)])}

  const [r,c]=out[out.length-1];ui.ss.r=ui.ss.r2=r;ui.ss.c=ui.ss.c2=out.length>1?out[0][1]:c;if(out.length>1)ui.ss.c2=c;ui.ss.scroll=true;schedule()}

async function ssImportFile(file){try{await loadXLSX()}catch(e){toast("نەتوانرا ئامرازی ئێکسڵ باربکرێت؛ ئینتەرنێت بپشکنە");return}

  if(id==="ss_rename"){if(e.key==="Enter"){e.preventDefault();e.target.blur()}if(e.key==="Escape"){ui.ssRename=null;schedule()}return}
  if(id==="ss_fx"){if(e.key==="Enter"){e.preventDefault();const v=e.target.value;ssSetCell(ui.ss.r,ui.ss.c,v).then(()=>ssGo(ui.ss.r+1,ui.ss.c));document.getElementById("ss_grid").focus()}if(e.key==="Escape"){e.target.value=ssRaw(ssSheet().cells[ssAddr(ui.ss.r,ui.ss.c)]);document.getElementById("ss_grid").focus()}return}
  if(id==="ss_edit"){if(e.key==="Enter"){e.preventDefault();ssCommit(e.shiftKey?-1:1,0)}else if(e.key==="Tab"){e.preventDefault();const rtl=ssSheet().rtl;ssCommit(0,e.shiftKey?-1:1)}else if(e.key==="Escape"){ui.ss.edit=false;ui.ss.ev="";schedule()}
    else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&!/^=/.test(e.target.value)){e.preventDefault();ssCommit(e.key==="ArrowDown"?1:-1,0)}return}
  if(id!=="ss_grid")return;
  const k=e.key,ctrl=e.ctrlKey||e.metaKey,rtl=ssSheet().rtl,s=ui.ss,er=e.shiftKey?s.r2:s.r,ec=e.shiftKey?s.c2:s.c;
  if(ctrl){const kk=k.toLowerCase();
    if(kk==="z"){e.preventDefault();ssUndo(false);return}if(kk==="y"){e.preventDefault();ssUndo(true);return}
    if(kk==="b"){e.preventDefault();const on=!((ssSheet().cells[ssAddr(s.r,s.c)]||{}).s||{}).b;ssStyle(()=>({b:on}));return}
    if(kk==="i"){e.preventDefault();const on=!((ssSheet().cells[ssAddr(s.r,s.c)]||{}).s||{}).i;ssStyle(()=>({i:on}));return}
    if(kk==="u"){e.preventDefault();const on=!((ssSheet().cells[ssAddr(s.r,s.c)]||{}).s||{}).u;ssStyle(()=>({u:on}));return}
    if(kk==="d"){e.preventDefault();ssFill("down");return}if(kk==="r"){e.preventDefault();ssFill("right");return}
    if(kk==="a"){e.preventDefault();s.r=0;s.c=0;s.r2=200;s.c2=40;ssPaint();return}
    return}
  if(e.altKey&&(k==="="||e.code==="Equal")){e.preventDefault();ssAuto("SUM");return}
  const move={ArrowDown:[1,0],ArrowUp:[-1,0],ArrowRight:[0,rtl?-1:1],ArrowLeft:[0,rtl?1:-1]}[k];
  if(move){e.preventDefault();ssGo(er+move[0],ec+move[1],e.shiftKey);return}
  if(k==="Enter"){e.preventDefault();ssGo(s.r+(e.shiftKey?-1:1),s.c);return}
  if(k==="Tab"){e.preventDefault();ssGo(s.r,s.c+(e.shiftKey?-1:1));return}
  if(k==="F2"){e.preventDefault();ssStartEdit();return}
  if(k==="Delete"||k==="Backspace"){e.preventDefault();ssClear();return}
  if(k==="Home"){e.preventDefault();ssGo(s.r,0);return}
  if(k.length===1&&!e.altKey){e.preventDefault();ssStartEdit(k)}});
document.addEventListener("input",e=>{if(e.target.id==="ss_edit")ui.ss.ev=e.target.value});
document.addEventListener("copy",e=>{if(ui.view!=="book"||document.activeElement?.id!=="ss_grid")return;e.preventDefault();e.clipboardData.setData("text/plain",ssCopyRange())});
document.addEventListener("cut",e=>{if(ui.view!=="book"||document.activeElement?.id!=="ss_grid")return;e.preventDefault();e.clipboardData.setData("text/plain",ssCopyRange());ssClear()});
document.addEventListener("paste",e=>{if(ui.view!=="book"||document.activeElement?.id!=="ss_grid")return;e.preventDefault();ssPaste(e.clipboardData.getData("text/plain")||"")});
document.addEventListener("change",e=>{if(ui.view!=="book")return;const id=e.target.id;
  if(id==="ss_name")ssChange(b=>{b.name=e.target.value.trim()||"Excel"});
  if(id==="ss_prj")ssChange(b=>{b.projectId=e.target.value});
  if(id==="ss_sz"){const v=+e.target.value;ssStyle(()=>({sz:v===11?"":v}))}
  if(id==="ss_fmt"){const v=e.target.value;ssStyle(()=>({fmt:v}))}
  if(id==="ss_fn"&&e.target.value){ssAuto(e.target.value)}
  if(id==="ss_bd"&&e.target.value){ssBorder(e.target.value)}
  if(id==="ss_zoom"){ui.ssZoom=+e.target.value;schedule()}
  if(id==="ss_rename"){const i=+e.target.dataset.i,v=e.target.value.trim();ui.ssRename=null;if(v)ssChange(b=>{b.sheets[i].name=v.slice(0,31)});else schedule()}});
document.addEventListener("focusout",e=>{if(e.target.id==="ss_rename"&&ui.ssRename!=null){const i=+e.target.dataset.i,v=e.target.value.trim();ui.ssRename=null;if(v&&v!==ssBook().sheets[i].name)ssChange(b=>{b.sheets[i].name=v.slice(0,31)});else schedule()}});
document.addEventListener("click",e=>{if(ui.view!=="book")return;const t=e.target.closest("[data-ss],[data-sstab],[data-act=ssexport],[data-act=ssdelbook]");if(!t)return;
  if(t.dataset.act==="ssexport"){ssExport();return}
  if(t.dataset.act==="ssdelbook"){if(ui.ssDelBook){const id=ui.ss.bid;ui.ssDelBook=false;ui.view="excel";del("books",id).then(()=>toast("سڕایەوە"))}else{ui.ssDelBook=true;schedule()}return}
  if(t.dataset.sstab!=null){ui.ss.si=+t.dataset.sstab;ui.ss.edit=false;ui.ssDelSheet=false;ui.ss.r=ui.ss.c=ui.ss.r2=ui.ss.c2=0;schedule();return}
  const a=t.dataset.ss,v=t.dataset.v,s=ui.ss,{r1,c1}=ssSel();
  switch(a){
    case "bold":{const on=!((ssSheet().cells[ssAddr(s.r,s.c)]||{}).s||{}).b;ssStyle(()=>({b:on}));break}
    case "fill":ui.ssLastFill=v;ui.ssPop=null;ssStyle(()=>({fill:v}));break;case "color":ui.ssLastColor=v;ui.ssPop=null;ssStyle(()=>({color:v}));break;
    case "al":{const rtl=ssSheet().rtl;const map=rtl?{left:"end",right:"start",center:"center"}:{left:"start",right:"end",center:"center"};ssStyle(()=>({al:map[v]}));break}
    case "merge":ssMerge();break;
    case "auto":ssAuto(v);break;
    case "insr":ssShift("r",r1,1);break;case "delr":{const {r1:a1,r2:a2}=ssSel();ssShift("r",a1,-(a2-a1+1));break}
    case "insc":ssShift("c",c1,1);break;case "delc":{const {c1:a1,c2:a2}=ssSel();ssShift("c",a1,-(a2-a1+1));break}
    case "rtl":ssChange((b,sh)=>{sh.rtl=!sh.rtl});break;
    case "full":ssFull(!ui.ssFull);break;
    case "pop":ui.ssPop=ui.ssPop===v?null:v;schedule();break;
    case "ital":{const on=!((ssSheet().cells[ssAddr(s.r,s.c)]||{}).s||{}).i;ssStyle(()=>({i:on}));break}
    case "undl":{const on=!((ssSheet().cells[ssAddr(s.r,s.c)]||{}).s||{}).u;ssStyle(()=>({u:on}));break}
    case "wrap":{const on=!((ssSheet().cells[ssAddr(s.r,s.c)]||{}).s||{}).w;ssStyle(()=>({w:on}));break}
    case "va":ssStyle(()=>({va:v==="bottom"?"":v}));break;
    case "szup":case "szdn":{const L=[8,9,10,11,12,14,16,18,20,22,24,28,36];ssStyle(st=>{const cur=st.sz||11;let i=L.findIndex(x=>x>=cur);if(i<0)i=L.length-1;const n=L[Math.max(0,Math.min(L.length-1,i+(a==="szup"?(L[i]===cur?1:0):-1)))];return {sz:n===11?"":n}});break}
    case "mergec":ssMerge();ssStyle(()=>({al:"center"}));break;
    case "nfmt":ssStyle(()=>({fmt:v}));break;
    case "dec":{const L=["#,##0","#,##0.0","#,##0.00"];ssStyle(st=>{const f=st.fmt||"";const pre=f[0]==="$"?"$":"",suf=/ IQD$/.test(f)?" IQD":"";const core=f.replace(/^\$/,"").replace(/ IQD$/,"");let i=L.indexOf(core);if(i<0)i=0;i=Math.max(0,Math.min(2,i+(+v)));return {fmt:pre+L[i]+suf}});break}
    case "preset":{const p=XPRESETS[+v];if(p)ssStyle(()=>({...p[1]}));break}
    case "copy":{const t=ssCopyRange();try{navigator.clipboard.writeText(t)}catch(err){}toast("لەبەرگیرایەوە");break}
    case "cut":{const t=ssCopyRange();try{navigator.clipboard.writeText(t)}catch(err){}ssClear();break}
    case "paste":(async()=>{try{const t=await navigator.clipboard.readText();if(t)ssPaste(t)}catch(err){toast("Ctrl+V بەکاربهێنە بۆ لکاندن")}})();break;
    case "filldown":ssFill("down");break;
    case "clear":ssClear();break;
    case "zoom":ui.ssZoom=Math.max(50,Math.min(200,(ui.ssZoom||100)+(+v)));schedule();break;
    case "undo":ssUndo(false);break;case "redo":ssUndo(true);break;
    case "addsheet":ssChange(b=>{b.sheets.push(ssNewSheet("Sheet"+(b.sheets.length+1)))}).then(()=>{ui.ss.si=ssBook().sheets.length-1;schedule()});break;
    case "delsheet":if(ui.ssDelSheet){const i=ui.ss.si;ui.ssDelSheet=false;ssChange(b=>{b.sheets.splice(i,1)}).then(()=>{ui.ss.si=Math.max(0,i-1);schedule()})}else{ui.ssDelSheet=true;schedule()}break}});


/* in the app the sheet is always full-window; «بچووککردنەوە» goes back to the list */
ssFull=function(on){if(!on){app({hd:"close"});return}ui.ssFull=true;schedule()};
window.addEventListener("message",e=>{const d=e.data||{};if(d.hd!=="load")return;
  S.books=d.books||{};S.projects=d.projects||{};if(d.settings)settings={...settings,...d.settings};
  if(ui.ss.bid!==d.bid)ui.ss={bid:d.bid,si:0,r:0,c:0,r2:0,c2:0};schedule()});
app({hd:"ready"});
</script></body></html>
